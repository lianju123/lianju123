name: Update private repo summary

on:
  schedule:
    - cron: "17 3 * * 1" # weekly, Mon 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate summary
        run: python3 scripts/update_repos.py
        env:
          REPO_TOKEN: ${{ secrets.REPO_SUMMARY_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: sync private repo summary"
          git push
